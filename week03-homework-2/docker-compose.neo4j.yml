version: "3.9"

services:
  neo4j:
    image: neo4j:5.18
    container_name: neo4j-graph-rag
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser / HTTP API
      - "7687:7687" # Bolt protocol for drivers & CLI
    environment:
      NEO4J_AUTH: "neo4j/neo4j_pass"
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
      - ./neo4j/import:/import
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_pass", "RETURN 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes: {}
