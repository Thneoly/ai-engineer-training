      - MODEL_NAME=${MODEL_NAME:-qwen-plus}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - MOCK_MODE=${REVIEW_MOCK:-false}
    ports:
      - "8103:8100"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as r; r.urlopen('http://127.0.0.1:8100/healthz')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mcp-net

  polish-service:
